name: Build Desktop App

on:
  push:
    branches:
      - main
      - security-hardening-fixes
  pull_request:
    branches:
      - main
      - security-hardening-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Compile Application (Frontend & Server)
        run: npm run build

      - name: Prepare Bundled Node Runtime
        run: |
          New-Item -ItemType Directory -Force -Path extra\bin
          Copy-Item (Get-Command node).Source extra\bin\node.exe

      - name: Package Windows Installer (.exe)
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brand4Less-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
